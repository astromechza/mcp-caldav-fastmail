[package]
name = "mcp-caldav-fastmail"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
tower = "0.5"
rmcp = { version = "0.9", features = ["server", "macros", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
webpki-root-certs = "1"
quick-xml = "0.37"
calcard = "0.1"
jsonwebtoken = "10"
jwks = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6.1"
sha2 = "0.11.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Strip symbols via the Rust toolchain (no external `strip`/binutils needed in
# the build image), keeping the scratch runtime image small.
strip = true
